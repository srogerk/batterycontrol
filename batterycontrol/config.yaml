name: BatteryControl
version: "0.6.4"
slug: batterycontrol
description: Kvartsvis batterioptimering (HiGHS LP) mot effekttariff och spotpris
url: https://github.com/srogerk/batterycontrol
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto

# Dashboarden serveras via ingress (sidopanelen), inte /local/.
ingress: true
ingress_port: 8099
panel_icon: mdi:battery-sync
panel_title: BatteryControl

# KRITISKT: utan denna nekar Supervisor-proxyn all atkomst till /core/api/.
# Appen ar da helt dov - den kan varken lasa sensorer eller skriva prognoser.
# Felet syns inte som ett fel: Supervisor svarar 403, men SupervisorHA._req
# svaljer HTTP-fel och returnerar None for GET, sa varje lasning faller
# tillbaka pa sin default (t.ex. 1500 W huslast). Appen ser ut att fungera
# men styr pa hittade varden. Darfor maste denna rad vara kvar.
homeassistant_api: true

# /data är den beständiga ytan (dygnsarkiv, prognostillstånd).
# config:rw krävs för att skriva dashboarden till /config/www/batterycontrol/
# så att den går att nå även via /local/ om man vill det.
map:
  - config:rw
  - share:ro

options:
  battery_capacity_kwh: 25.0
  soc_min_pct: 15.0
  soc_max_pct: 100.0
  battery_max_kw: 10.0
  max_grid_hour_kw: 13.5
  tariff_rate_kr_per_kw: 45.0
  tariff_floor_kw: 1.3
  wear_kr_per_kwh: 0.15
  ev_battery_kwh: 10.0
  dry_run: false
  loop_interval_seconds: 900
schema:
  battery_capacity_kwh: float(1.0,200.0)
  soc_min_pct: float(0.0,100.0)
  soc_max_pct: float(0.0,100.0)
  battery_max_kw: float(0.1,50.0)
  max_grid_hour_kw: float(0.5,100.0)
  tariff_rate_kr_per_kw: float(0.0,500.0)
  tariff_floor_kw: float(0.0,50.0)
  wear_kr_per_kwh: float(0.0,10.0)
  ev_battery_kwh: float(0.0,200.0)
  dry_run: bool
  loop_interval_seconds: int(60,3600)
